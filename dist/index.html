<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../src/output.css" rel="stylesheet">
</head>
<body class="bg-slate-800 ">
   
     <!-- Navbar start here -->
        <nav class="w-full h-14 bg-amber-50 flex justify-between px-4 items-center md:px-4">
            <div class="text-cyan-400 font-bold">INVENT</div>
            <ul class="md:flex hidden font-semibold ">
                <li class="mx-2.5 cursor-pointer transition-all duration-300 hover:text-[#8CC0EB] hover:scale-110">
                    <a href="index.html">Home</a></li>
                <li class="mx-2.5 cursor-pointer transition-all duration-300 hover:text-[#8CC0EB] hover:scale-110"><a href="about.html">About Us</a></li>
                <li class="mx-2.5 cursor-pointer transition-all duration-300 hover:text-[#8CC0EB] hover:scale-110"><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="hidden md:block px-2 py-2 bg-[#3B7597] rounded cursor-pointer">Login/SignUp</div>
            <div class="md:hidden ">
                <a class="text-4xl" href="">&#8801</a>
            </div>
        </nav>
     <!-- navbar end here -->

     <header class="w-full h-auto">
    
       
            <div id="homeSection" class="h-screen flex items-center justify-center flex-col gap-3 transition-all duration-500">
            <p class="font-bold text-6xl text-amber-50 block">Manage Your Inventory </p>
            <button onclick="manage()" class="bg-amber-50 block rounded text-black p-2">Manage</button>
            </div> 


            <div id="manageSection"  class="hidden transition-all duration-500 m-7">
                 <h1 class="text-white text-2xl text-center ">Inventory Dashboard</h1>

                   
           
            <div id="productList" class="">
                <h2 class="text-white text-2xl mb-4">Product List</h2>

                <table class="bg-white border border-gray-300 w-full">
                <thead>
                <tr class="bg-[#3B7597] text-white">
                           <th class="border p-2">ID</th>
                           <th class="border p-2">Product Name</th>
                            <th class="border p-2">Price</th>
                            <th class="border p-2">Action</th>
                </tr>
                </thead>

                <tbody id="productTableBody">
                </tbody>
                </table>
                <button onclick="showAddForm()" class="bg-[#3B7597] text-white px-3 py-2 rounded-2xl pl-2.5 mt-2.5"> &#43 Add new Entry

                </button>
                
            </div>
             
            <div id="addForm" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
    
             <div class="bg-white p-6 rounded-2xl w-80 shadow-lg">

            <h2 class="text-xl font-bold mb-4 text-center"> Add Product</h2>

            <input class="w-full border p-2 mb-3 rounded" type="text" id="name" placeholder="Enter product name">

            <input class="w-full border p-2 mb-3 rounded" type="text" id="price" placeholder="Enter product price">

                <button type="button" class="bg-[#3B7597] text-white w-full py-2 rounded-xl hover:bg-[#2f5f7a]" onclick="addProduct()">Add Items</button>

                <button class="bg-[#3B7597] text-white w-full py-2 rounded-xl hover:bg-[#2f5f7a] mt-2" onclick="hideAddForm()"> Cancel</button>

            </div>
      </div>
            <div id="deleteSection" class="hidden">
                <h2>Delete Product</h2>
            </div>
           </div> 

                
            
        <!-- </div> -->
       

     </header>
     
        
            
        <script src="../src/app.js"></script>
     

</body>
</html>
